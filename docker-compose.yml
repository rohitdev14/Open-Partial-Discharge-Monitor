name: open-pd-monitor

# Architecture baseline only.
# Service images/Dockerfiles will be implemented incrementally.

services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdmonitor}
      POSTGRES_USER: ${POSTGRES_USER:-pdmonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pd-db:/var/lib/postgresql/data
    profiles: ["simulator", "hardware", "scada"]

  backend:
    build: ./backend
    environment:
      PD_PROFILE: ${PD_PROFILE:-simulator}
    depends_on:
      - database
    ports:
      - "${API_PORT:-8000}:8000"
    profiles: ["simulator", "hardware", "scada"]

  acquisition-simulator:
    build: ./acquisition
    environment:
      PD_PROFILE: simulator
      PD_MAINS_FREQUENCY_HZ: ${PD_MAINS_FREQUENCY_HZ:-50}
    profiles: ["simulator"]

  acquisition-hardware:
    build: ./acquisition
    environment:
      PD_PROFILE: hardware
    profiles: ["hardware", "scada"]

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:8080"
    profiles: ["simulator", "hardware", "scada"]

  opcua:
    build: ./opcua
    depends_on:
      - backend
    ports:
      - "${OPCUA_PORT:-4840}:4840"
    profiles: ["scada"]

volumes:
  pd-db:
